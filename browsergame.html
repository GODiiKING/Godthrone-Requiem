<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godthrone: Requiem — Tactical Battle</title>
<link rel="stylesheet" href="./css/variables.css" />
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/layout.css" />
<link rel="stylesheet" href="./css/components.css" />
<link rel="stylesheet" href="./css/actions.css" />
<link rel="stylesheet" href="./css/overlay.css" />

</head>
<body>
  <div class="game-container">

    <div class="legend">
      <span><strong>Move</strong> up to 4 tiles</span>
      <span><strong>Attack</strong> melee, range 1</span>
      <span><strong>Arcane Bolt</strong> 15 MP · range 3</span>
    </div>

    <div class="battle-area">
      <div class="canvas-frame">
        <canvas id="grid" width="512" height="384"></canvas>
      </div>

      <div class="side-panel">
        <div id="turnIndicator">PLAYER TURN</div>

        <div class="stat-card player-card">
          <h3>🛡️ Player</h3>
          <div class="bar-row">
            <div class="bar-label"><span>HP</span><span id="playerHpText">100 / 100</span></div>
            <div class="bar-bg"><div class="bar-fill hp-fill" id="playerHpFill" style="width:100%"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-label"><span>Magic</span><span id="playerMagText">40 / 40</span></div>
            <div class="bar-bg"><div class="bar-fill mag-fill" id="playerMagFill" style="width:100%"></div></div>
          </div>
          <div class="mini-stats">
            <div>ATK<span id="playerAtk">18</span></div>
            <div>DEF<span id="playerDef">6</span></div>
            <div>MOV<span id="playerMov">4</span></div>
          </div>
        </div>

        <div class="stat-card enemy-card">
          <h3>👹 Enemy</h3>
          <div class="bar-row">
            <div class="bar-label"><span>HP</span><span id="enemyHpText">90 / 90</span></div>
            <div class="bar-bg"><div class="bar-fill hp-fill" id="enemyHpFill" style="width:100%"></div></div>
          </div>
          <div class="mini-stats">
            <div>ATK<span id="enemyAtk">14</span></div>
            <div>DEF<span id="enemyDef">5</span></div>
            <div>MOV<span id="enemyMov">3</span></div>
          </div>
        </div>

        <div id="distanceReadout">Distance to Enemy: —</div>

        <div class="actions">
          <button class="action-btn" id="btnMove" title="Move up to your Movement Range">Move</button>
          <button class="action-btn" id="btnAttack" title="Melee attack, requires adjacency">Attack</button>
          <button class="action-btn" id="btnMagic" title="Arcane Bolt — 15 MP, range 3">Magic</button>
          <button class="action-btn" id="btnEndTurn" title="End your turn">End Turn</button>
        </div>

        <div id="log"></div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-box">
      <h2 id="overlayTitle">VICTORY</h2>
      <p id="overlayText">You have vanquished your foe.</p>
      <button id="btnRestart">Restart Battle</button>
    </div>
  </div>

  <script src="./js/game.js"></script>
</body>
</html>
